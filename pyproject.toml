[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "freedom-cqa"
version = "0.1.0"
description = "Versioned, evidence-based dialogue evaluation for Freedom Broker CQA"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "tokenizers==0.22.2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "jsonschema==4.23.0"]

[project.scripts]
cqa = "cqa.cli:main"

[tool.setuptools.packages.find]
include = ["cqa*"]

[tool.setuptools.package-data]
cqa = ["review.html", "app.html", "web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
